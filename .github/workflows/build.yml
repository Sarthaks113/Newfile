name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unzip the newest uploaded project zip
        run: |
          ZIP="$(git -c core.quotepath=false log -1 --diff-filter=AM --name-only --format= -- '*.zip')"
          echo "Using: $ZIP"
          unzip -q "$ZIP"
      - name: Build APK
        working-directory: GlassClock
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GlassClock-apk
          path: GlassClock/app/build/outputs/apk/debug/app-debug.apk
